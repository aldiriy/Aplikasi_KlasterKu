{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                <h4 class="fw-bold mb-1">
                    <i class="bi bi-chat-left-text-fill text-primary me-2"></i>Pengaduan / Saran
                </h4>
                <p class="text-muted mb-4">
                    Sampaikan masalah, bug, atau saran pengembangan aplikasi.
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Subjek</label>
                        <input type="text" name="subjek" class="form-control form-control-lg" 
                               required placeholder="Contoh: Error saat upload data">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Pesan</label>
                        <textarea name="pesan" class="form-control" rows="6" required
                                  placeholder="Jelaskan detail pengaduan atau saran Anda di sini..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg px-4">
                        <i class="bi bi-send-fill me-2"></i>Kirim Pengaduan
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
