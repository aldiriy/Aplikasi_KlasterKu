{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-4">Edit Kemasan</h5>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Kode Kemasan</label>
                            <input type="text" name="kode_kemasan" class="form-control" value="{{ kemasan.kode_kemasan }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nama Kemasan</label>
                            <input type="text" name="nama_kemasan" class="form-control" value="{{ kemasan.nama_kemasan }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Kapasitas</label>
                            <input type="number" name="kapasitas" class="form-control" value="{{ kemasan.kapasitas }}" step="0.01">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Satuan Kapasitas</label>
                            <input type="text" name="satuan_kapasitas" class="form-control" value="{{ kemasan.satuan_kapasitas }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Satuan</label>
                            <input type="text" name="satuan" class="form-control" value="{{ kemasan.satuan }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Metode</label>
                            <select name="metode" class="form-select">
                                <option value="FIFO" {% if kemasan.metode == 'FIFO' %}selected{% endif %}>FIFO</option>
                                <option value="LIFO" {% if kemasan.metode == 'LIFO' %}selected{% endif %}>LIFO</option>
                            </select>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary rounded-pill px-4">Simpan</button>
                            <a href="{% url 'master_kemasan' %}" class="btn btn-outline-secondary rounded-pill px-4">Batal</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
