{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-3">Tambah Stok Kemasan</h5>
                    <p class="text-muted mb-3">{{ kemasan.nama_kemasan }} (<code>{{ kemasan.kode_kemasan }}</code>)</p>
                    <p class="mb-4">Stok saat ini: <strong>{{ kemasan.stok_total }} {{ kemasan.satuan }}</strong></p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Qty Masuk</label>
                            <input type="number" name="qty" class="form-control" step="0.01" min="0.01" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tanggal</label>
                            <input type="date" name="tanggal" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Keterangan</label>
                            <input type="text" name="keterangan" class="form-control">
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success rounded-pill px-4">Simpan</button>
                            <a href="{% url 'master_kemasan' %}" class="btn btn-outline-secondary rounded-pill px-4">Batal</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
