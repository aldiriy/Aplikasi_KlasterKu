{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-4">Edit Label</h5>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Kode Label</label>
                            <input type="text" name="kode_label" class="form-control" value="{{ label.kode_label }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nama Label</label>
                            <input type="text" name="nama_label" class="form-control" value="{{ label.nama_label }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Gramasi</label>
                            <input type="text" name="gramasi" class="form-control" value="{{ label.gramasi }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Satuan</label>
                            <input type="text" name="satuan" class="form-control" value="{{ label.satuan }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Metode</label>
                            <select name="metode" class="form-select">
                                <option value="FIFO" {% if label.metode == 'FIFO' %}selected{% endif %}>FIFO</option>
                                <option value="LIFO" {% if label.metode == 'LIFO' %}selected{% endif %}>LIFO</option>
                            </select>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary rounded-pill px-4">Simpan</button>
                            <a href="{% url 'master_label' %}" class="btn btn-outline-secondary rounded-pill px-4">Batal</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
