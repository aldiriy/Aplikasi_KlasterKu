{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body p-4">
        <h4 class="fw-bold mb-1"><i class="bi bi-palette me-2"></i>Preferensi & Tema</h4>
        <p class="text-muted mb-4">Atur tampilan aplikasi sesuai keinginan Anda.</p>

        <div class="row g-4">
            <!-- Tema -->
            <div class="col-md-6">
                <div class="border rounded-3 p-4 h-100">
                    <h6 class="fw-semibold mb-3">Tema Aplikasi</h6>
                    
                    <div class="d-flex gap-3 mb-3">
                        <button id="btnLight" class="btn btn-outline-primary px-4" onclick="setTheme('light')">
                            <i class="bi bi-sun-fill me-2"></i> Terang
                        </button>
                        <button id="btnDark" class="btn btn-outline-secondary px-4" onclick="setTheme('dark')">
                            <i class="bi bi-moon-stars-fill me-2"></i> Gelap
                        </button>
                    </div>

                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="autoTheme">
                        <label class="form-check-label" for="autoTheme">
                            Ikuti tema sistem (otomatis)
                        </label>
                    </div>
                </div>
            </div>

            <!-- Lainnya -->
            <div class="col-md-6">
                <div class="border rounded-3 p-4 h-100">
                    <h6 class="fw-semibold mb-3">Pengaturan Lain</h6>
                    
                    <div class="mb-3">
                        <label class="form-label">Bahasa</label>
                        <select class="form-select" disabled>
                            <option selected>Bahasa Indonesia</option>
                        </select>
                    </div>

                    <div class="form-check form-switch mb-2">
                        <input class="form-check-input" type="checkbox" id="animasi" checked>
                        <label class="form-check-label" for="animasi">Aktifkan animasi</label>
                    </div>

                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="notif" checked>
                        <label class="form-check-label" for="notif">Tampilkan notifikasi</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <button class="btn btn-primary" onclick="simpanPreferensi()">
                <i class="bi bi-check-lg me-1"></i> Simpan Preferensi
            </button>
        </div>
    </div>
</div>

<script>
function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('klasterku-theme', theme);
    
    // Update tombol aktif
    document.getElementById('btnLight').classList.toggle('btn-primary', theme === 'light');
    document.getElementById('btnLight').classList.toggle('btn-outline-primary', theme !== 'light');
    document.getElementById('btnDark').classList.toggle('btn-dark', theme === 'dark');
    document.getElementById('btnDark').classList.toggle('btn-outline-secondary', theme !== 'dark');
}

function simpanPreferensi() {
    Swal.fire({
        icon: 'success',
        title: 'Berhasil!',
        text: 'Preferensi berhasil disimpan',
        timer: 1500,
        showConfirmButton: false
    });
}

// Load tema saat halaman dibuka
document.addEventListener('DOMContentLoaded', function() {
    const saved = localStorage.getItem('klasterku-theme') || 'light';
    setTheme(saved);
});
</script>
{% endblock %}
