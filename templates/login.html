<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Login - KlasterKu</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f6f9;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    width:400px;
    border:none;
    border-radius:15px;
}

</style>

</head>

<body>

<div class="card shadow">

<div class="card-header bg-primary text-white text-center">
<h3>KLASTERKU</h3>
</div>

<div class="card-body">

<form method="post">

{% csrf_token %}

{{ form.as_p }}

<button class="btn btn-primary w-100">
Login
</button>

</form>

<hr>

<p class="text-center">
Belum punya akun?
<a href="{% url 'register' %}">
Daftar
</a>
</p>

</div>

</div>

</body>
</html>
