<script>
const kValues = {{ k_values|safe }};
const inertias = {{ inertias|safe }};

const ctx = document.getElementById('elbowChart');

new Chart(ctx, {
    type: 'line',
    data: {
        labels: kValues,
        datasets: [{
            label: 'Inertia',
            data: inertias,
            borderWidth: 3,
            tension: 0.3,
            fill: false
        }]
    },
    options: {
        responsive: true,
        plugins: {
            legend: {
                display: true
            }
        },
        scales: {
            x: {
                title: {
                    display: true,
                    text: 'Jumlah Cluster (K)'
                }
            },
            y: {
                title: {
                    display: true,
                    text: 'Inertia / WCSS'
                }
            }
        }
    }
});
</script>
